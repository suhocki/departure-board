serialization = "1.9.0"
datetime = "0.7.1"
coroutines = "1.10.2"
hilt = "2.60.1"
retrofit = "3.0.0"
okhttp = "5.4.0"
junit = "4.13.2"
turbine = "1.2.1"
androidxJunit = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"
robolectric = "4.18"
